AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CyberSentinel AI MVP scaffold

Resources:
  ThreatAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cybersentinel.lambda_handler.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          CYBERSENTINEL_ALERT_THRESHOLD: CRITICAL
          CYBERSENTINEL_SYSTEM_PROMPT_PATH: prompts/system_prompt.txt
          CYBERSENTINEL_BEDROCK_MODEL_ID: ""
          CYBERSENTINEL_SNS_TOPIC_ARN: ""
          AWS_REGION: us-east-1

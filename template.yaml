AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CyberSentinel AI MVP scaffold

Parameters:
  AlertThreshold:
    Type: String
    Default: CRITICAL
  SystemPromptPath:
    Type: String
    Default: prompts/system_prompt.txt
  BedrockModelId:
    Type: String
    Default: ""
  SnsTopicArn:
    Type: String
    Default: ""
  GitHubTokenSecretArn:
    Type: String
    Default: ""
    NoEcho: true
  DefaultSource:
    Type: String
    Default: github
  DefaultQuery:
    Type: String
    Default: ""
  GitHubApiUrl:
    Type: String
    Default: https://api.github.com
  GitHubApiVersion:
    Type: String
    Default: 2022-11-28

Resources:
  ThreatAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cybersentinel.lambda_handler.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 30
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !If
                - HasBedrockModelId
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                - !Ref AWS::NoValue
            - Sid: SnsPublish
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !If
                - HasSnsTopicArn
                - !Ref SnsTopicArn
                - !Ref AWS::NoValue
      Environment:
        Variables:
          CYBERSENTINEL_ALERT_THRESHOLD: !Ref AlertThreshold
          CYBERSENTINEL_SYSTEM_PROMPT_PATH: !Ref SystemPromptPath
          CYBERSENTINEL_BEDROCK_MODEL_ID: !Ref BedrockModelId
          CYBERSENTINEL_SNS_TOPIC_ARN: !Ref SnsTopicArn
          CYBERSENTINEL_DEFAULT_SOURCE: !Ref DefaultSource
          CYBERSENTINEL_DEFAULT_QUERY: !Ref DefaultQuery
          CYBERSENTINEL_GITHUB_TOKEN_SECRET_ARN: !Ref GitHubTokenSecretArn
          CYBERSENTINEL_GITHUB_API_URL: !Ref GitHubApiUrl
          CYBERSENTINEL_GITHUB_API_VERSION: !Ref GitHubApiVersion
          AWS_REGION: us-east-1

  ScheduledCollectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: cybersentinel.scheduled_handler.handler
      Runtime: python3.11
      MemorySize: 256
      Timeout: 60
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: BedrockInvoke
              Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: !If
                - HasBedrockModelId
                - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelId}
                - !Ref AWS::NoValue
            - Sid: SnsPublish
              Effect: Allow
              Action:
                - sns:Publish
              Resource: !If
                - HasSnsTopicArn
                - !Ref SnsTopicArn
                - !Ref AWS::NoValue
            - Sid: ReadGitHubTokenSecret
              Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !If
                - HasGitHubTokenSecretArn
                - !Ref GitHubTokenSecretArn
                - !Ref AWS::NoValue
      Environment:
        Variables:
          CYBERSENTINEL_ALERT_THRESHOLD: !Ref AlertThreshold
          CYBERSENTINEL_SYSTEM_PROMPT_PATH: !Ref SystemPromptPath
          CYBERSENTINEL_BEDROCK_MODEL_ID: !Ref BedrockModelId
          CYBERSENTINEL_SNS_TOPIC_ARN: !Ref SnsTopicArn
          CYBERSENTINEL_DEFAULT_SOURCE: !Ref DefaultSource
          CYBERSENTINEL_DEFAULT_QUERY: !Ref DefaultQuery
          CYBERSENTINEL_GITHUB_TOKEN_SECRET_ARN: !Ref GitHubTokenSecretArn
          CYBERSENTINEL_GITHUB_API_URL: !Ref GitHubApiUrl
          CYBERSENTINEL_GITHUB_API_VERSION: !Ref GitHubApiVersion
          AWS_REGION: us-east-1
      Events:
        ScheduledRun:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Enabled: true

Outputs:
  ThreatAnalysisFunctionName:
    Value: !Ref ThreatAnalysisFunction
  ScheduledCollectionFunctionName:
    Value: !Ref ScheduledCollectionFunction

Conditions:
  HasBedrockModelId: !Not [!Equals [!Ref BedrockModelId, ""]]
  HasSnsTopicArn: !Not [!Equals [!Ref SnsTopicArn, ""]]
  HasGitHubTokenSecretArn: !Not [!Equals [!Ref GitHubTokenSecretArn, ""]]

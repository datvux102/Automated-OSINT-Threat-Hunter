name: Deploy

on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: CloudFormation stack name
        required: true
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      alert_threshold:
        description: Alert threshold
        required: true
        default: CRITICAL
      default_source:
        description: Scheduled collector source
        required: true
        default: github
      default_query:
        description: Scheduled collector query
        required: true
      bedrock_model_id:
        description: Optional Bedrock model ID
        required: false
        default: ""
      sns_topic_arn:
        description: Optional SNS topic ARN
        required: false
        default: ""
      github_token_secret_arn:
        description: Optional Secrets Manager ARN for GitHub token
        required: false
        default: ""
      alarm_notification_topic_arn:
        description: Optional SNS topic ARN for CloudWatch alarms
        required: false
        default: ""
      github_max_attempts:
        description: Max GitHub retry attempts
        required: true
        default: "3"
      github_backoff_seconds:
        description: Base GitHub retry backoff in seconds
        required: true
        default: "1"
      github_per_page:
        description: GitHub results per page
        required: true
        default: "5"
      github_max_pages:
        description: GitHub pages to scan per run
        required: true
        default: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: Build
        run: sam build --template-file template.yaml

      - name: Deploy
        run: |
          sam deploy \
            --stack-name "${{ inputs.stack_name }}" \
            --resolve-s3 \
            --region "${{ inputs.aws_region }}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --parameter-overrides \
              AlertThreshold="${{ inputs.alert_threshold }}" \
              DefaultSource="${{ inputs.default_source }}" \
              DefaultQuery="${{ inputs.default_query }}" \
              BedrockModelId="${{ inputs.bedrock_model_id }}" \
              SnsTopicArn="${{ inputs.sns_topic_arn }}" \
              GitHubTokenSecretArn="${{ inputs.github_token_secret_arn }}" \
              AlarmNotificationTopicArn="${{ inputs.alarm_notification_topic_arn }}" \
              GitHubMaxAttempts="${{ inputs.github_max_attempts }}" \
              GitHubBackoffSeconds="${{ inputs.github_backoff_seconds }}" \
              GitHubPerPage="${{ inputs.github_per_page }}" \
              GitHubMaxPages="${{ inputs.github_max_pages }}"
